# Chess Piece Detection - YOLO Training Configuration
# Dataset: 12-class chess piece detection (white/black × 6 piece types)

path: ./dataset
train: train/images
val: train/images  # Using train set for validation as 'valid' folder is missing

nc: 12

names:
  0: black_bishop
  1: black_king
  2: black_knight
  3: black_pawn
  4: black_queen
  5: black_rook
  6: white_bishop
  7: white_king
  8: white_knight
  9: white_pawn
  10: white_queen
  11: white_rook
